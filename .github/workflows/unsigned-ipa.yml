name: Unsigned IPA

# Builds a Release archive WITHOUT code signing and packages it as an .ipa.
# An unsigned IPA cannot be installed as-is: it must be signed before iOS will
# run it (e.g. with a free Apple ID via Sideloadly/AltStore – see docs/SIDELOADING.md).

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: B2F_TEAM_ID="" xcodegen generate

      - name: Archive (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Book2Flashcards.xcodeproj \
            -scheme Book2Flashcards \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Book2Flashcards.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" | xcbeautify

      - name: Package IPA
        run: |
          APP="build/Book2Flashcards.xcarchive/Products/Applications/Book2Flashcards.app"
          test -d "$APP" || { echo "App bundle not found in archive"; exit 1; }
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          NAME="Book2Flashcards-${VERSION}-${BUILD}-${GITHUB_SHA::7}-unsigned.ipa"
          (cd build/ipa && zip -qry "../$NAME" Payload)
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          # Sanity checks: correct platform, arm64 binary, not signed.
          /usr/libexec/PlistBuddy -c "Print CFBundleSupportedPlatforms:0" "$APP/Info.plist"
          lipo -info "$APP/Book2Flashcards"
          codesign -dv "$APP" 2>&1 | head -3 || true
          ls -lh "build/$NAME"

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          IPA="$PWD/build/$IPA_NAME"
          V="$PWD/build/verify"
          rm -rf "$V" && mkdir -p "$V" && cd "$V"
          unzip -q "$IPA"

          APP=$(ls -d Payload/*.app)
          EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP/Info.plist")
          EXE="$APP/$EXE_NAME"
          DSYM="$GITHUB_WORKSPACE/build/Book2Flashcards.xcarchive/dSYMs/$(basename "$APP").dSYM"

          test -f "$EXE" || { echo "::error::Executable $EXE_NAME missing from $APP"; exit 1; }
          EXE_BYTES=$(stat -f%z "$EXE")
          APP_BYTES=$(find "$APP" -type f -exec stat -f%z {} + | awk '{s+=$1} END {print s}')
          RES_BYTES=$((APP_BYTES - EXE_BYTES))
          IPA_BYTES=$(stat -f%z "$IPA")
          FILES_IN_IPA=$(unzip -Z1 "$IPA" | grep -vc '/$')
          TEXT_BYTES=$(size -m -l "$EXE" | awk '/Section __text:/ {print $3; exit}')
          ARCHS=$(lipo -archs "$EXE")
          ALL_SYMS=$(nm "$EXE" 2>/dev/null | wc -l | tr -d ' ')
          DEFINED_SYMS=$(nm -U "$EXE" 2>/dev/null | wc -l | tr -d ' ')
          B2F_SYMS=$(nm "$EXE" 2>/dev/null | grep -c 'B2FCore' || true)
          EXE_UUID=$(dwarfdump --uuid "$EXE" | awk '{print $2}')
          DSYM_UUID=$(dwarfdump --uuid "$DSYM" | awk '{print $2}')
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")

          human() { awk -v b="$1" 'BEGIN { split("B KB MB GB",u); i=1; while (b>=1024 && i<4) { b/=1024; i++ } printf "%.2f %s", b, u[i] }'; }

          # Hard checks: fail the job if the binary is missing, empty or not a real arm64 app.
          [ "$EXE_BYTES" -gt 500000 ] || { echo "::error::Executable is only $EXE_BYTES bytes"; exit 1; }
          [ "${TEXT_BYTES:-0}" -gt 200000 ] || { echo "::error::__TEXT,__text is only ${TEXT_BYTES:-0} bytes"; exit 1; }
          echo "$ARCHS" | grep -qw arm64 || { echo "::error::Executable is not arm64 ($ARCHS)"; exit 1; }
          [ "$EXE_UUID" = "$DSYM_UUID" ] || { echo "::error::Executable UUID $EXE_UUID != dSYM UUID $DSYM_UUID"; exit 1; }
          otool -l "$EXE" | grep -q LC_MAIN || { echo "::error::No LC_MAIN entry point"; exit 1; }

          {
            echo "## IPA verification: \`$IPA_NAME\`"
            echo
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| IPA size | $(human $IPA_BYTES) ($IPA_BYTES bytes) |"
            echo "| Files inside IPA | $FILES_IN_IPA |"
            echo "| App bundle (uncompressed) | $(human $APP_BYTES) ($APP_BYTES bytes) |"
            echo "| Executable \`$EXE_NAME\` | $(human $EXE_BYTES) ($EXE_BYTES bytes) |"
            echo "| Resources (bundle − executable) | $(human $RES_BYTES) ($RES_BYTES bytes) |"
            echo "| Code (\`__TEXT,__text\`) | $(human $TEXT_BYTES) ($TEXT_BYTES bytes) |"
            echo "| Architectures | $ARCHS |"
            echo "| Bundle ID / min iOS | $BUNDLE_ID / $MIN_OS |"
            echo "| Symbols: total / defined / B2FCore | $ALL_SYMS / $DEFINED_SYMS / $B2F_SYMS |"
            echo "| Executable UUID | $EXE_UUID |"
            echo "| dSYM UUID (archive) | $DSYM_UUID – **match** |"
            echo
            echo "### Payload structure"
            echo '```'
            find Payload -maxdepth 3 | sort
            echo '```'
            echo
            echo "### Files by size (largest 25)"
            echo '```'
            find "$APP" -type f -exec stat -f '%z %N' {} + | sort -rn | awk 'NR<=25 {printf "%10d  %s\n", $1, $2}'
            echo '```'
            echo
            echo "### Mach-O header, segments, linked libraries"
            echo '```'
            file "$EXE"
            otool -hv "$EXE"
            size -m "$EXE" | grep -E '^Segment|Section __text|total'
            otool -L "$EXE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Book2Flashcards-${{ github.sha }}-dSYM
          path: build/Book2Flashcards.xcarchive/dSYMs
          retention-days: 30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: build/${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error
