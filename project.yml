# XcodeGen project spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# The generated Book2Flashcards.xcodeproj is git-ignored; this file is the source of truth.
name: Book2Flashcards

options:
  bundleIdPrefix: com.book2flashcards
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ${B2F_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  B2FCore:
    path: Packages/B2FCore

targets:
  Book2Flashcards:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Products.storekit"
      - path: App/Resources/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.book2flashcards.pro
        PRODUCT_NAME: Book2Flashcards
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Book2Flashcards.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        # Base URL of the optional AI proxy backend (no secrets here). Empty = bring-your-own-key.
        B2F_PROXY_BASE_URL: ""
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: B2FCore

  Book2FlashcardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      # SKTestSession loads the StoreKit configuration from the test bundle.
      - path: App/Resources/Products.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.book2flashcards.pro.tests
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: Book2Flashcards
      - package: B2FCore
        link: false

  Book2FlashcardsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.book2flashcards.pro.uitests
        TEST_TARGET_NAME: Book2Flashcards
    dependencies:
      - target: Book2Flashcards

schemes:
  Book2Flashcards:
    build:
      targets:
        Book2Flashcards: all
        Book2FlashcardsTests: [test]
        Book2FlashcardsUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Book2Flashcards
      targets:
        - Book2FlashcardsTests
        - Book2FlashcardsUITests
    archive:
      config: Release
